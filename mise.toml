[tools]
node = "22.23.4"

[tasks.install]
description = "Install dependencies of all workspaces"
run = "npm ci"

[tasks.contract]
description = "Compile TypeSpec -> OpenAPI and regenerate client/server types"
run = "npm run contract"

[tasks."contract:check"]
description = "Fail if generated contract files are out of date"
# Compares the worktree with the index, so regenerated files only need `git add`; untracked output fails too.
run = [
  "npm run contract",
  '''
paths="api-contract/openapi.yaml frontend/src/api/schema.d.ts backend/src/api/model/schema.d.ts backend/src/api/model/zod"
stale=$(git status --porcelain --untracked-files=all -- $paths | grep '^.[^ ]' || true)
if [ -n "$stale" ]; then
  echo "$stale"
  git --no-pager diff -- $paths
  echo "Generated contract files are out of date: run 'npm run contract' and commit the result." >&2
  exit 1
fi
''',
]

[tasks.lint]
description = "oxlint for frontend and backend"
run = "npm run lint"

[tasks.typecheck]
description = "tsc in all workspaces"
run = "npm run typecheck"

[tasks.test]
description = "Backend unit/API tests and frontend component tests (Vitest)"
run = "npm test"

[tasks.e2e]
description = "Playwright scenarios against the production build"
run = "npm run test:e2e"

[tasks."check:rule-guard"]
description = "Fail unless the conflict API tests fail with the overlap check patched out"
run = "scripts/rule-guard/check.sh"

[tasks.check]
description = "All checks, locally and in CI"
run = [
  "mise run contract:check",
  "mise run lint",
  "mise run typecheck",
  "mise run test",
  "mise run check:rule-guard",
  "mise run e2e",
]
