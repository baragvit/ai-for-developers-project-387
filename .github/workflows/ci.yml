name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: mise run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t call-booking .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8080:8080 call-booking
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/owner && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/api/event-types
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker rm -f app
