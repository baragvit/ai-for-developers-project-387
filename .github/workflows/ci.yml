name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: mise run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  # Independent browser check of the author's exact version (head SHA, not the temporary merge commit), with a trace
  # and screenshots of passing tests. No model and no secrets, so it also runs for fork PRs. A finished run's artifact
  # stays as evidence of its head after new pushes; a run cancelled by a newer push leaves no artifact.
  browser-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright on the head SHA
        id: e2e
        env:
          E2E_EVIDENCE: "1"
        run: |
          set +e
          npx playwright test --project=desktop
          code=$?
          if [ "$code" = 0 ]; then result=passed; else result=failed; fi
          {
            echo "pr: #${{ github.event.pull_request.number }}"
            echo "event head sha: $HEAD_SHA"
            echo "git rev-parse HEAD: $(git rev-parse HEAD)"
            echo "result: $result"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            echo "finished: $(date -u +%FT%TZ)"
          } | tee browser-check.txt
          {
            echo '### Browser check'
            echo '```'
            cat browser-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-check-${{ github.event.pull_request.head.sha }}
          path: |
            e2e/browser-check.txt
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t call-booking .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8080:8080 call-booking
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/owner && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/api/event-types
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker rm -f app
