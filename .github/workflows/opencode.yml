name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Command in the comment, a human author with write access to the repo; bots (including the agent) are ignored.
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      # On a fork PR the agent would check out and could run the fork's code with the model key.
      - name: Skip pull requests from forks
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          head="$GITHUB_REPOSITORY"
          if [ -n "$PR" ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.repo.full_name)
          fi
          if [ "$head" = "$GITHUB_REPOSITORY" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #$PR comes from fork $head, the agent is not run."
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.origin.outputs.trusted == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        if: steps.origin.outputs.trusted == 'true'
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Token for `gh` in the skills (docs/agents/issue-tracker.md): reads the repo, writes issues, labels and their
          # links. Comments and pushes use the app token.
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          share: false
