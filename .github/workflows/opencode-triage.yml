name: opencode-triage

on:
  issues:
    types: [opened]

concurrency:
  group: opencode-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    # A human author with write access who is not a bot, and an issue that has not already been triaged past the
    # intake states. Tickets produced by to-spec/to-tickets already carry ready-for-agent, so they are not re-triaged.
    if: |
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
      !contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Nobody answers a permission prompt on the runner: an "ask" hangs until the timeout.
          OPENCODE_PERMISSION: '{"external_directory": {"*": "deny", "/tmp/*": "allow"}, "doom_loop": "deny"}'
        with:
          model: opencode/deepseek-v4.1-flash
          share: false
          prompt: |
            Triage the newly opened issue #${{ github.event.issue.number }} in this repository.

            Follow the `triage` skill in `.agents/skills/triage/SKILL.md`. Before deciding, read `AGENTS.md`,
            `docs/agents/triage-labels.md`, `docs/agents/issue-tracker.md`, `docs/agents/domain.md`,
            `GLOSSARY.md`, the relevant ADRs in `docs/adr/`, and inspect the existing application so the
            assessment reflects what the app already does. Start every issue comment with the skill's
            AI-generated disclaimer.

            Apply one category label (`bug` or `enhancement`) and exactly one state label:
            - If the request already contains enough information to act on, add `needs-triage` and comment
              with a short assessment, a summary of the relevant parts of the codebase (including whether
              the behavior already exists), and a concrete suggested next step.
            - If essential information is missing, ask specific, actionable questions and add `needs-info`
              instead.

            Your final answer is posted to the issue as the triage comment, so do not post comments with
            `gh`; use `gh` only to read issues and apply labels. Do not change code, create branches, open
            pull requests, or push commits.
